<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }} | Field Journal &amp; Development Tracker{% endif %}</title>
  <meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | escape }}{% elsif page.description %}{{ page.description | strip_html | escape }}{% else %}{{ site.pitch | strip_html | escape }}{% endif %}">
  <meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title | escape }} | {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{% if page.summary %}{{ page.summary | strip_html | escape }}{% elsif page.description %}{{ page.description | strip_html | escape }}{% else %}{{ site.pitch | strip_html | escape }}{% endif %}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:locale" content="en_GB">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} Dev Log RSS" href="{{ '/feed.xml' | relative_url }}">

  <script>
    (function () {
      var saved = null;
      try {
        saved = window.localStorage.getItem('paleo_theme');
      } catch (e) {
        saved = null;
      }
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body class="journal-body">
  <a class="skip-link" href="#main-content">Skip to main journal content</a>

  <div class="site-shell">
    {% include header.html %}

    <main id="main-content" class="main-content" tabindex="-1">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
