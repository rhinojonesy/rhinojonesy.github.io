# ==============================================================================
# PROJECT PALEO - SITE SETTINGS
# ==============================================================================
# Edit the values on the right side of each colon (:).
# Keep the quotation marks ("") around your text so colons or symbols inside
# your sentences do not break the file.

title: "Project Paleo"
pitch: "A cosy fossil-hunting and museum-building game for PC, made in Godot 4 with the Steam Deck in mind."

# Current build details shown on the Home page and header stamp
current_version: "0.17.0"
current_version_date: "23 Oct 2026"
working_on_now: "Polishing the first two hours from playtest feedback"

# The screenshot buried under dirt on the Home page, for visitors to brush off.
# Leave both as "" to use the first picture in _data/gallery.yml instead.
reveal_image: ""
reveal_caption: ""

# ==============================================================================
# COMMUNITY AND STORE LINKS
# ==============================================================================
# Leave any link as "" (empty quotes) until you are ready to show it.
# Anything left empty simply stays hidden on the website.

discord_url: ""
tiktok_url: ""
instagram_url: ""
youtube_url: ""
steam_url: ""

# ==============================================================================
# GITHUB PAGES ADDRESS SETUP (BASEURL)
# ==============================================================================
# There are two ways to name your repository on GitHub:
#
# Option 1 (Recommended and simplest):
#   Name your repository "<username>.github.io" (replace <username> with your
#   actual GitHub username, for example "jodigs.github.io").
#   Your site will live at https://<username>.github.io/
#   For Option 1, keep baseurl set to "" below.
#
# Option 2 (Any other repository name):
#   If you name your repository something else, such as "project-paleo",
#   your site will live at https://<username>.github.io/project-paleo/
#   For Option 2, change baseurl below to "/project-paleo" (start with a
#   forward slash, and do not put a slash at the end).

url: "https://rhinojonesy.github.io"
baseurl: ""

# ==============================================================================
# TECHNICAL SETTINGS FOR GITHUB PAGES (JEKYLL 3.10)
# ==============================================================================
# You do not need to change anything below this line.

timezone: Europe/London
permalink: /devlog/:year/:month/:day/:title/
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - _templates
  - README.md
  - .pages.yml
