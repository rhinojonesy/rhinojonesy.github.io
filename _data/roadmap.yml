# ==============================================================================
# ROCK STRATA ROADMAP DATA
# ==============================================================================
# Each item has:
#   title: Short name of the feature or milestone (put in quotes "")
#   line: One short sentence explaining it (put in quotes "")
#   status: Must be one of: planned, digging, done
#     - planned = Top layers (Fair muted colour)
#     - digging = Active middle trench being dug now (Excellent gold colour)
#     - done    = Deep settled bedrock layers at the bottom (Pristine sea-glass)
#   percent: Optional number from 0 to 100. Leave out or delete the line if not needed.
#
# YAML TIP: Keep the two-space indentation exact, and always wrap text in
# double quotes ("") if it contains a colon (:).

items:
